name: Auto Update

on:
  schedule:
    - cron: '0 1 * * *' # Runs at 01:00 UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  update:
    runs-on: windows-latest # Scoop and the update script require Windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git operations

      - name: Run Update Script
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
          THROW_ERROR: '0'

      - name: Update README.md
        shell: bash
        run: |
          chmod +x scripts/update-readme.sh
          ./scripts/update-readme.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update tools list in README"
            git push
          else
            echo "No changes to commit"
          fi
