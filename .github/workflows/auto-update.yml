name: Auto Update

on:
  schedule:
    - cron: '0 1 * * *' # Runs at 01:00 UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  update:
    runs-on: windows-latest # Scoop and its checkver script require Windows
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git operations

      # ScoopInstaller/GithubActions pushes straight to the branch it runs on,
      # which main rejects, so run Scoop's checkver directly and open a PR.
      - name: Install Scoop
        shell: pwsh
        run: iex "& {$(irm get.scoop.sh)} -RunAsAdmin"

      - name: Update manifests
        shell: pwsh
        run: |
          $checkver = Join-Path $env:USERPROFILE 'scoop\apps\scoop\current\bin\checkver.ps1'
          & $checkver -Dir (Join-Path $env:GITHUB_WORKSPACE 'bucket') -Update -SkipUpdated

      - name: Update README.md
        shell: bash
        run: |
          chmod +x scripts/update-readme.sh
          ./scripts/update-readme.sh

      # main only accepts squash-merged pull requests, so changes go through a
      # PR like every other change. The PR isn't tied to a tracked issue, hence
      # the no-issue-needed label. Nothing for a human to gate on: it is a
      # deterministic version/hash bump to the latest published release.
      - name: Open and merge pull request
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- bucket README.md)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="auto/update-manifests-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add bucket/*.json README.md
          git commit -m "chore: update manifests to latest releases"
          git push origin "$BRANCH"
          {
            echo "Automatically generated by the **Auto Update** workflow."
            echo
            for f in $(git diff --name-only HEAD~1 -- 'bucket/*.json'); do
              echo "- \`$(basename "$f" .json)\` → \`$(jq -r .version "$f")\`"
            done
          } > pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update manifests to latest releases" --body-file pr-body.md
          gh pr edit "$BRANCH" --add-label no-issue-needed || true
          # --auto needs pending required checks; with none, merge directly.
          gh pr merge "$BRANCH" --auto --squash || gh pr merge "$BRANCH" --squash
