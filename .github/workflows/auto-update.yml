name: Auto Update

on:
  schedule:
    - cron: '0 1 * * *' # Runs at 01:00 UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  update:
    runs-on: windows-latest # Scoop and its checkver script require Windows
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git operations

      # ScoopInstaller/GithubActions pushes straight to the branch it runs on,
      # which main rejects, so run Scoop's checkver directly and open a PR.
      - name: Install Scoop
        shell: pwsh
        run: iex "& {$(irm get.scoop.sh)} -RunAsAdmin"

      - name: Update manifests
        shell: pwsh
        run: |
          $checkver = Join-Path $env:USERPROFILE 'scoop\apps\scoop\current\bin\checkver.ps1'
          & $checkver -Dir (Join-Path $env:GITHUB_WORKSPACE 'bucket') -Update -SkipUpdated

      - name: Update README.md
        shell: bash
        run: |
          chmod +x scripts/update-readme.sh
          ./scripts/update-readme.sh

      # main only accepts signed commits through pull requests, so the
      # update goes through a PR like every other change: open-signed-pr.sh
      # commits via the GitHub API (GitHub signs it), labels the PR
      # no-issue-needed, and squash-merges it. Nothing for a human to gate
      # on: it is a version/hash bump to the latest published release.
      - name: Open and merge pull request
        shell: bash
        run: |
          changed=$(git diff --name-only -- bucket README.md)
          if [ -z "$changed" ]; then
            echo "No changes to commit"
            exit 0
          fi
          {
            echo "Automatically generated by the **Auto Update** workflow."
            echo
            for f in $(git diff --name-only -- 'bucket/*.json'); do
              echo "- \`$(basename "$f" .json)\` → \`$(jq -r .version "$f")\`"
            done
          } > "$RUNNER_TEMP/pr-body.md"
          # shellcheck disable=SC2086 # one path per word
          bash scripts/open-signed-pr.sh "auto/update-manifests-$(date -u +%Y%m%d-%H%M%S)" \
            "chore: update manifests to latest releases" "$RUNNER_TEMP/pr-body.md" $changed
